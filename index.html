<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Frescas Popayán</title>
    <!-- Tailwind CSS para el diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM SIN crossorigin para evitar bloqueos locales -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#16a34a',
                            orange: '#f97316',
                            cream: '#fdfbf7'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-cream text-gray-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Base de datos de productos actualizada con los nombres exactos y nuevo producto
        const catalog = [
            { id: 1, category: 'Yogurt casero', name: 'Yogurt casero de mango', unit: '1 litro', price: 12000, img: 'Yogurt_casero_de_mango.jpg' },
            { id: 2, category: 'Yogurt casero', name: 'Yogurt casero de mora', unit: '1 litro', price: 12000, img: 'Yogurt_casero_de_mora.jpg' },
            { id: 3, category: 'Yogurt casero', name: 'Yogurt casero de fresa', unit: '1 litro', price: 12000, img: 'Yogurt_casero_de_fresa.jpg' },
            { id: 4, category: 'Yogurt casero', name: 'Yogurt casero de melocotón', unit: '1 litro', price: 12000, img: 'Yogurt_casero_de_melocotón.jpg' },
            { id: 5, category: 'Yogurt casero', name: 'Yogurt personal con cereales', unit: 'Personal', price: 5000, img: 'Yogurt_personal_con_cereales.jpg' },
            
            { id: 6, category: 'Carne de cerdo', name: 'Lomo de cerdo', unit: '1 libra', price: 11000, img: 'Lomo_de_cerdo.jpg' },
            { id: 7, category: 'Carne de cerdo', name: 'Carne de pierna de cerdo', unit: '1 libra', price: 10000, img: 'Carne_de_pierna_de_cerdo.jpg' },
            { id: 8, category: 'Carne de cerdo', name: 'Espinazo de cerdo', unit: '1 libra', price: 8000, img: 'Espinazo_de_cerdo.jpg' },
            { id: 16, category: 'Carne de cerdo', name: 'Costilla de cerdo', unit: '1 libra', price: 9000, img: 'Costillac.jpg' }, // ¡Producto nuevo agregado aquí!
            
            { id: 9, category: 'Quesos', name: 'Queso campesino', unit: '1 libra', price: 11000, img: 'Queso_campesino.jpg' },
            
            { id: 10, category: 'Pollo', name: 'Bandeja de pollo', unit: '1 bandeja', price: 6000, img: 'Bandeja_de_pollo.jpg' },
            { id: 11, category: 'Pollo', name: 'Pechuga de pollo', unit: '1 libra', price: 11000, img: 'Pechuga_de_pollo.jpg' },
            
            { id: 12, category: 'Pescados', name: 'Tilapia roja', unit: '1 libra', price: 15000, img: 'Tilapia_roja.jpg' },
            { id: 13, category: 'Pescados', name: 'Tilapia negra', unit: '1 libra', price: 13000, img: 'Tilapia_negra.jpg' },
            { id: 14, category: 'Pescados', name: 'Bagre de río', unit: '1 libra', price: 15000, img: 'Bagre_de_río.jpg' },
            { id: 15, category: 'Pescados', name: 'Cabeza de pescado', unit: '1 libra', price: 7000, img: 'Cabeza_de_pescado.jpg' }
        ];

        const formatCOP = (num) => new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(num);

        function App() {
            const [cart, setCart] = useState([]);
            const [view, setView] = useState('home'); 
            const [categoryFilter, setCategoryFilter] = useState('Todas');
            const [search, setSearch] = useState('');

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const deliveryFee = 2000;
            const total = subtotal > 0 ? subtotal + deliveryFee : 0;

            const addToCart = (product, quantity) => {
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    setCart(cart.map(item => item.id === product.id ? { ...item, quantity: item.quantity + quantity } : item));
                } else {
                    setCart([...cart, { ...product, quantity }]);
                }
            };

            const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));
            const updateQuantity = (id, quantity) => {
                if (quantity < 1) return removeFromCart(id);
                setCart(cart.map(item => item.id === id ? { ...item, quantity } : item));
            };

            const filteredProducts = useMemo(() => {
                return catalog.filter(p => {
                    const matchCategory = categoryFilter === 'Todas' || p.category === categoryFilter;
                    const matchSearch = p.name.toLowerCase().includes(search.toLowerCase());
                    return matchCategory && matchSearch;
                });
            }, [categoryFilter, search]);

            const categories = ['Todas', ...new Set(catalog.map(p => p.category))];

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-brand-green text-white shadow-md sticky top-0 z-50">
                        <div className="container mx-auto px-4 py-3 flex justify-between items-center">
                            <div className="flex items-center space-x-2 cursor-pointer" onClick={() => setView('home')}>
                                <i className="fa-solid fa-basket-shopping text-2xl text-brand-orange"></i>
                                <h1 className="text-xl font-bold tracking-tight">Delicias Frescas Popayán</h1>
                            </div>
                            <nav className="flex space-x-4">
                                <button onClick={() => setView('catalog')} className="hover:text-brand-orange transition font-medium">Catálogo</button>
                                <button onClick={() => setView('cart')} className="relative flex items-center hover:text-brand-orange transition">
                                    <i className="fa-solid fa-cart-shopping text-xl"></i>
                                    {cart.length > 0 && (
                                        <span className="absolute -top-2 -right-2 bg-brand-orange text-white text-xs rounded-full h-5 w-5 flex items-center justify-center font-bold">
                                            {cart.reduce((acc, item) => acc + item.quantity, 0)}
                                        </span>
                                    )}
                                </button>
                            </nav>
                        </div>
                    </header>

                    <main className="flex-grow">
                        {view === 'home' && <Home setView={setView} />}
                        {view === 'catalog' && <Catalog products={filteredProducts} categories={categories} filter={categoryFilter} setFilter={setCategoryFilter} search={search} setSearch={setSearch} addToCart={addToCart} />}
                        {view === 'cart' && <Cart cart={cart} updateQuantity={updateQuantity} removeFromCart={removeFromCart} subtotal={subtotal} deliveryFee={deliveryFee} total={total} setView={setView} />}
                        {view === 'checkout' && <Checkout cart={cart} subtotal={subtotal} deliveryFee={deliveryFee} total={total} setView={setView} setCart={setCart} />}
                    </main>

                    <a href="https://wa.me/573239229622" target="_blank" className="fixed bottom-6 right-6 bg-[#25D366] text-white p-4 rounded-full shadow-lg hover:scale-110 transition-transform flex items-center justify-center z-50">
                        <i className="fa-brands fa-whatsapp text-3xl"></i>
                    </a>

                    <footer className="bg-gray-800 text-white py-8 mt-12">
                        <div className="container mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <h3 className="font-bold text-lg mb-2 text-brand-green">Delicias Frescas Popayán</h3>
                                <p className="text-gray-300 text-sm">Frescura, calidad y sabor hasta tu hogar.</p>
                                <p className="text-gray-300 text-sm mt-2"><i className="fa-solid fa-location-dot"></i> Popayán, Cauca, Colombia</p>
                            </div>
                            <div>
                                <h3 className="font-bold text-lg mb-2">Contacto</h3>
                                <p className="text-gray-300 text-sm"><i className="fa-brands fa-whatsapp"></i> 3239229622</p>
                                <p className="text-gray-300 text-sm"><i className="fa-regular fa-envelope"></i> gomeztingo01@gmail.com</p>
                            </div>
                            <div>
                                <h3 className="font-bold text-lg mb-2">Políticas</h3>
                                <ul className="text-gray-300 text-sm space-y-1">
                                    <li><a href="#" className="hover:text-brand-orange">Tratamiento de datos (Ley 1581)</a></li>
                                    <li><a href="#" className="hover:text-brand-orange">Términos y condiciones</a></li>
                                </ul>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const Home = ({ setView }) => (
            <div>
                <div className="relative h-[60vh] bg-cover bg-center flex items-center justify-center text-center" style={{ backgroundImage: "linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1542838132-92c53300491e?w=1200&q=80')" }}>
                    <div className="text-white px-4 max-w-3xl">
                        <h1 className="text-4xl md:text-6xl font-bold mb-4">¡Bienvenido a Delicias Frescas Popayán!</h1>
                        <p className="text-lg md:text-xl mb-6">Yogurt casero y productos frescos para disfrutar en casa. Haz tu pedido de manera fácil y recibe en Popayán.</p>
                        <div className="bg-brand-orange/90 text-white font-bold py-2 px-4 rounded-lg inline-block mb-8 shadow-lg text-lg">
                            <i className="fa-solid fa-motorcycle mr-2"></i> ¡Llevamos tus productos hasta tu hogar por solo $2.000!
                        </div>
                        <div className="flex flex-wrap justify-center gap-4">
                            <button onClick={() => setView('catalog')} className="bg-brand-green hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full transition shadow-lg">Comprar ahora</button>
                            <a href="https://wa.me/573239229622" target="_blank" className="bg-white text-gray-800 hover:bg-gray-100 font-bold py-3 px-8 rounded-full transition shadow-lg flex items-center">
                                <i className="fa-brands fa-whatsapp text-[#25D366] text-xl mr-2"></i> Pedir por WhatsApp
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Catalog = ({ products, categories, filter, setFilter, search, setSearch, addToCart }) => (
            <div className="container mx-auto px-4 py-8">
                <h2 className="text-3xl font-bold text-gray-800 mb-6 border-b-2 border-brand-green inline-block pb-1">Nuestro Catálogo</h2>
                
                <div className="flex flex-col md:flex-row justify-between items-center mb-8 space-y-4 md:space-y-0">
                    <div className="flex space-x-2 overflow-x-auto w-full md:w-auto pb-2">
                        {categories.map(cat => (
                            <button key={cat} onClick={() => setFilter(cat)} className={`px-4 py-2 rounded-full whitespace-nowrap text-sm font-medium transition ${filter === cat ? 'bg-brand-green text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
                                {cat}
                            </button>
                        ))}
                    </div>
                    <div className="relative w-full md:w-64">
                        <input type="text" placeholder="Buscar producto..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full pl-10 pr-4 py-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-brand-green" />
                        <i className="fa-solid fa-search absolute left-4 top-3 text-gray-400"></i>
                    </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    {products.map(product => <ProductCard key={product.id} product={product} addToCart={addToCart} />)}
                </div>
                {products.length === 0 && <p className="text-center text-gray-500 mt-10">No se encontraron productos.</p>}
            </div>
        );

        const ProductCard = ({ product, addToCart }) => {
            const [qty, setQty] = useState(1);
            
            return (
                <div className="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col">
                    <div className="overflow-hidden w-full h-56 bg-white flex items-center justify-center p-2">
                        <img src={product.img} alt={product.name} className="w-full h-full object-contain transition-transform duration-300 hover:scale-125" />
                    </div>
                    <div className="p-4 flex flex-col flex-grow border-t border-gray-100">
                        <span className="text-xs font-bold text-brand-orange uppercase tracking-wide mb-1">{product.category}</span>
                        <h3 className="text-lg font-bold text-gray-800 leading-tight mb-1">{product.name}</h3>
                        <p className="text-sm text-gray-500 mb-3">Presentación: {product.unit}</p>
                        <div className="mt-auto">
                            <p className="text-xl font-bold text-brand-green mb-3">{formatCOP(product.price)}</p>
                            <div className="flex items-center space-x-2">
                                <input type="number" min="1" value={qty} onChange={(e) => setQty(parseInt(e.target.value) || 1)} className="w-16 border rounded text-center py-2 focus:outline-none focus:border-brand-green" />
                                <button onClick={() => { addToCart(product, qty); setQty(1); }} className="flex-1 bg-brand-green hover:bg-green-600 text-white font-bold py-2 rounded transition flex items-center justify-center">
                                    <i className="fa-solid fa-cart-plus mr-2"></i> Agregar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            )
        };

        const Cart = ({ cart, updateQuantity, removeFromCart, subtotal, deliveryFee, total, setView }) => (
            <div className="container mx-auto px-4 py-8 max-w-4xl">
                <h2 className="text-3xl font-bold text-gray-800 mb-6">Tu Carrito</h2>
                {cart.length === 0 ? (
                    <div className="text-center py-12 bg-white rounded-xl shadow-sm border">
                        <i className="fa-solid fa-basket-shopping text-6xl text-gray-300 mb-4"></i>
                        <p className="text-xl text-gray-500 mb-6">Tu carrito está vacío.</p>
                        <button onClick={() => setView('catalog')} className="bg-brand-green text-white px-6 py-2 rounded-full font-bold">Volver al catálogo</button>
                    </div>
                ) : (
                    <div className="bg-white rounded-xl shadow-md overflow-hidden">
                        <div className="p-6">
                            {cart.map(item => (
                                <div key={item.id} className="flex flex-col sm:flex-row items-center justify-between py-4 border-b last:border-0 gap-4">
                                    <div className="flex items-center w-full sm:w-auto">
                                        <img src={item.img} className="w-16 h-16 rounded object-cover mr-4" alt={item.name}/>
                                        <div>
                                            <h4 className="font-bold text-gray-800">{item.name}</h4>
                                            <p className="text-sm text-gray-500">{item.unit} | {formatCOP(item.price)} und</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center justify-between w-full sm:w-auto gap-6">
                                        <div className="flex items-center border rounded">
                                            <button onClick={() => updateQuantity(item.id, item.quantity - 1)} className="px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold">-</button>
                                            <span className="px-4 py-1 font-medium">{item.quantity}</span>
                                            <button onClick={() => updateQuantity(item.id, item.quantity + 1)} className="px-3 py-1 bg-gray-100 hover:bg-gray-200 text-gray-600 font-bold">+</button>
                                        </div>
                                        <div className="text-right font-bold w-24">{formatCOP(item.price * item.quantity)}</div>
                                        <button onClick={() => removeFromCart(item.id)} className="text-red-500 hover:text-red-700 p-2"><i className="fa-solid fa-trash"></i></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="bg-gray-50 p-6 border-t">
                            <div className="flex justify-between mb-2 text-gray-600"><span>Subtotal de productos:</span> <span>{formatCOP(subtotal)}</span></div>
                            <div className="flex justify-between mb-4 text-gray-600"><span>Costo de domicilio (Popayán):</span> <span>{formatCOP(deliveryFee)}</span></div>
                            <div className="flex justify-between items-center border-t pt-4">
                                <span className="text-xl font-bold">Total a Pagar:</span>
                                <span className="text-2xl font-bold text-brand-green">{formatCOP(total)}</span>
                            </div>
                            <div className="mt-6 flex flex-col sm:flex-row gap-4 justify-end">
                                <button onClick={() => setView('catalog')} className="px-6 py-3 border border-brand-green text-brand-green font-bold rounded-lg hover:bg-green-50 transition">Seguir Comprando</button>
                                <button onClick={() => setView('checkout')} className="px-6 py-3 bg-brand-orange text-white font-bold rounded-lg hover:bg-orange-600 transition shadow-md">Finalizar Pedido</button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );

        const Checkout = ({ cart, subtotal, deliveryFee, total, setView, setCart }) => {
            const [formData, setFormData] = useState({
                nombre: '', telefono: '', direccion: '', barrio: '', referencia: '', pago: 'Efectivo', observaciones: '', terminos: false
            });

            const handleChange = (e) => setFormData({...formData, [e.target.name]: e.target.type === 'checkbox' ? e.target.checked : e.target.value});

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.terminos) return alert("Debes aceptar la política de tratamiento de datos.");

                let orderText = `Hola, Delicias Frescas Popayán. Quiero realizar el siguiente pedido:\n\n`;
                cart.forEach(item => {
                    orderText += `- ${item.quantity}x ${item.name} (${item.unit}): ${formatCOP(item.price * item.quantity)}\n`;
                });
                orderText += `\nSubtotal: ${formatCOP(subtotal)}\nDomicilio: ${formatCOP(deliveryFee)}\n*Total: ${formatCOP(total)}*\n\n`;
                orderText += `*Datos del Cliente:*\nNombre: ${formData.nombre}\nTeléfono: ${formData.telefono}\nDirección: ${formData.direccion}, Barrio ${formData.barrio}\n`;
                if(formData.referencia) orderText += `Ref: ${formData.referencia}\n`;
                orderText += `Medio de pago: ${formData.pago}\n`;
                if(formData.observaciones) orderText += `Observaciones: ${formData.observaciones}\n`;
                orderText += `\nPor favor, confirmen la disponibilidad y recepción de mi pedido.`;

                const waUrl = `https://wa.me/573239229622?text=${encodeURIComponent(orderText)}`;
                window.open(waUrl, '_blank');
            };

            return (
                <div className="container mx-auto px-4 py-8 max-w-6xl grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div>
                        <h2 className="text-2xl font-bold mb-6">Datos de Envío</h2>
                        <form id="checkoutForm" onSubmit={handleSubmit} className="bg-white p-6 rounded-xl shadow-md space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium mb-1">Nombres y Apellidos *</label><input required type="text" name="nombre" onChange={handleChange} className="w-full border rounded p-2 focus:ring-2 focus:ring-brand-green outline-none" /></div>
                                <div><label className="block text-sm font-medium mb-1">Teléfono (WhatsApp) *</label><input required type="tel" name="telefono" onChange={handleChange} className="w-full border rounded p-2 focus:ring-2 focus:ring-brand-green outline-none" /></div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium mb-1">Dirección completa *</label><input required type="text" name="direccion" onChange={handleChange} className="w-full border rounded p-2 focus:ring-2 focus:ring-brand-green outline-none" /></div>
                                <div><label className="block text-sm font-medium mb-1">Barrio (Solo Popayán) *</label><input required type="text" name="barrio" onChange={handleChange} className="w-full border rounded p-2 focus:ring-2 focus:ring-brand-green outline-none" /></div>
                            </div>
                            <div><label className="block text-sm font-medium mb-1">Referencias de ubicación (Opcional)</label><input type="text" name="referencia" onChange={handleChange} className="w-full border rounded p-2 focus:ring-2 focus:ring-brand-green outline-none" /></div>
                            <div>
                                <label className="block text-sm font-medium mb-1">Medio de Pago *</label>
                                <select name="pago" onChange={handleChange} className="w-full border rounded p-2 focus:ring-2 focus:ring-brand-green outline-none">
                                    <option value="Efectivo">Efectivo al recibir</option>
                                    <option value="Nequi">Nequi</option>
                                </select>
                            </div>
                            
                            {formData.pago === 'Nequi' && (
                                <div className="bg-purple-50 border border-purple-200 p-4 rounded-lg flex items-center justify-between">
                                    <div>
                                        <p className="font-bold text-purple-900">Pago por Nequi</p>
                                        <p className="text-sm text-purple-800">Número oficial: <strong>3104493773</strong></p>
                                        <p className="text-xs text-purple-700 mt-1">El estado del pedido será "Pendiente de verificación" hasta validar el pago.</p>
                                    </div>
                                    <button type="button" onClick={() => navigator.clipboard.writeText('3104493773')} className="bg-purple-600 text-white px-3 py-1 rounded text-sm hover:bg-purple-700">Copiar No.</button>
                                </div>
                            )}

                            <div><label className="block text-sm font-medium mb-1">Observaciones (Opcional)</label><textarea name="observaciones" onChange={handleChange} className="w-full border rounded p-2 focus:ring-2 focus:ring-brand-green outline-none" rows="2"></textarea></div>
                            <div className="flex items-start mt-4">
                                <input required type="checkbox" name="terminos" onChange={handleChange} className="mt-1 mr-2" id="terminos" />
                                <label htmlFor="terminos" className="text-sm text-gray-600">Acepto la <a href="#" className="text-brand-green underline">política de privacidad y tratamiento de datos personales</a> (Ley 1581 de 2012).</label>
                            </div>
                        </form>
                    </div>

                    <div>
                        <h2 className="text-2xl font-bold mb-6">Resumen del Pedido</h2>
                        <div className="bg-gray-50 p-6 rounded-xl shadow-md border">
                            <div className="space-y-3 mb-6 max-h-64 overflow-y-auto">
                                {cart.map(item => (
                                    <div key={item.id} className="flex justify-between text-sm border-b pb-2">
                                        <span className="text-gray-700">{item.quantity}x {item.name}</span>
                                        <span className="font-medium">{formatCOP(item.price * item.quantity)}</span>
                                    </div>
                                ))}
                            </div>
                            <div className="flex justify-between text-gray-600 mb-2"><span>Subtotal:</span> <span>{formatCOP(subtotal)}</span></div>
                            <div className="flex justify-between text-gray-600 mb-4"><span>Domicilio (Popayán):</span> <span>{formatCOP(deliveryFee)}</span></div>
                            <div className="flex justify-between items-center border-t pt-4 mb-6">
                                <span className="text-xl font-bold">Total Final:</span>
                                <span className="text-2xl font-bold text-brand-green">{formatCOP(total)}</span>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={() => setView('cart')} className="w-1/3 py-3 border border-gray-300 text-gray-700 font-bold rounded-lg hover:bg-gray-100 transition">Volver</button>
                                <button type="submit" form="checkoutForm" className="w-2/3 py-3 bg-[#25D366] text-white font-bold rounded-lg hover:bg-green-600 transition shadow-md flex justify-center items-center">
                                    <i className="fa-brands fa-whatsapp text-xl mr-2"></i> Confirmar y Enviar Pedido
                                </button>
                            </div>
                            <p className="text-xs text-gray-500 text-center mt-4">
                                Al confirmar, se abrirá WhatsApp con los detalles de tu compra para enviarlos al negocio.
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
